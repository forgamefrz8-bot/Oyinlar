*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:480px;margin:0 auto;padding:14px;padding-bottom:80px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1 1 30%;padding:11px 2px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;font-size:12.5px}
.tabs button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.card[data-open]{cursor:pointer}
.mu{color:var(--mu);font-size:13px}
.n{font-size:36px;font-weight:800;margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--ac)}.dn{color:var(--rd)}
.bt{display:flex;gap:6px;margin-top:10px}
.bt button,.pb{flex:1;padding:10px 2px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:13px}
.bt button.s{background:var(--rd)}
.bt button.b{background:var(--blue)}
.bt button:disabled{opacity:.4}
.rs,.bk{background:none;border:0;color:var(--mu);font:inherit;margin:4px 0 8px;padding:6px 0}
.rs{text-decoration:underline}
.fi{display:block;width:100%;padding:10px 12px;margin:8px 0;border-radius:10px;border:2px solid var(--bar);background:var(--bg);color:var(--tx);font:inherit}
.msg{min-height:20px;font-size:14px;margin-top:6px}
.ic{border-radius:50%;object-fit:cover;flex:none;display:block;box-shadow:0 2px 5px rgba(0,0,0,.1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--bg)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--bar);border-radius:12px;padding:12px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ctr{display:flex;align-items:center;gap:14px;margin-top:6px}
.ctr button{width:34px;height:34px;border:0;border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:20px;font-weight:700}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{border:2px solid var(--bar);border-radius:10px;background:var(--card);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx);font:inherit;font-size:11px}
.cell.on{border-color:var(--ac)}.cell:disabled{opacity:.4}.cell b{font-size:12px}
.cnt{width:96px;margin:0;text-align:center;padding:7px}
.bt .fi{margin:0;flex:2;min-width:0}
@keyframes sp{0%{transform:rotate(0) scale(1)}50%{transform:rotate(360deg) scale(1.3)}100%{transform:rotate(720deg) scale(1)}}
.ar{padding:10px 0;border-top:1px solid var(--bar);margin-top:8px}
.pb{display:block;width:100%}
h4{margin:0 0 2px;font-size:15px}

/* PLASTIK KARTA DIZAYNI */
.bank-card {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-radius: 20px;
  padding: 24px;
  color: #fff;
  box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
}
.bank-card::before {
  content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%); transform: rotate(30deg);
}
.card-chip { width: 40px; height: 30px; background: linear-gradient(135deg, #fbbf24, #d97706); border-radius: 6px; margin-bottom: 20px; position: relative; }
.card-chip::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(0,0,0,0.2); transform: translateY(-50%); }
.card-number { font-size: 20px; letter-spacing: 3px; font-family: monospace; margin-bottom: 20px; }
.card-info { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; color: #94a3b8; }
.card-info b { color: #fff; font-size: 14px; display: block; margin-top: 4px; letter-spacing: 1px; }
.card-balance { position: absolute; top: 24px; right: 24px; text-align: right; }
.card-balance b { font-size: 22px; display: block; }
.card-logo { position: absolute; bottom: 24px; right: 24px; font-weight: 800; font-style: italic; opacity: 0.8; }
</style>

function fresh(){

 var cnum="8600 0000 "+Math.floor(1000+Math.random()*9000)+" "+Math.floor(1000+Math.random()*9000);

try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.px)S=fresh();
if(S.card===undefined){S.card=0;S.cardNum="8600 0000 "+Math.floor(1000+Math.random()*9000)+" "+Math.floor(1000+Math.random()*9000);}
S.used=S.used||[];S.pp=S.pp||{};S.custom=S.custom||{};S.cstocks=S.cstocks||[];S.inbox=S.inbox||[];S.got=S.got||[];

function okSt(s){return s&&typeof s.t==="string"&&/^[A-Z0-9]{2,5}$/.test(s.t)&&typeof s.n==="string"&&/^[\p{L}\p{N} .'ʻ’&-]{1,24}$/u.test(s.n)&&s.p>=.05&&s.v>0&&s.v<=.2&&typeof s.c==="string"&&/^[A-Z0-9]{3,16}$/.test(s.c)}

 ST.length=0;BASE_ST.forEach(function(b){ST.push(b)});customStocks().forEach(function(s){ST.push(s)});

 ST.forEach(function(s){SM[s.t]=s;if(S.px[s.t]===undefined||!S.h[s.t]){S.px[s.t]=s.p;S.h[s.t]=[s.p]}});

 for(var q in S.pp)if(!SM[q])delete S.pp[q];

applyStocks();

function save(){S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function rnd(){var u=0;for(var i=0;i<6;i++)u+=Math.random();return(u-3)/Math.sqrt(.5)}
function step(){ST.forEach(function(s){
 if(S.pp[s.t]!==undefined||S.px[s.t]===undefined||!S.h[s.t])return;
 var c=S.px[s.t],bs=(ST2.fx[s.t]&&+ST2.fx[s.t].p>0)?+ST2.fx[s.t].p:s.p,p=c*(1+s.d+s.v*rnd()+.01*(bs/c-1));
 if(p<.05)p=.05+Math.random()*.05;
 S.px[s.t]=p;var h=S.h[s.t];h.push(p);if(h.length>40)h.shift()})}
var n0=Math.min(60,Math.floor((Date.now()-S.t)/4000));for(var i=0;i<n0;i++)step();

 var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a),hh=big?60:28,pts=a.map(function(v,i){return(i*100/(a.length-1||1)).toFixed(1)+","+(hh-(v-mn)/((mx-mn)||1)*hh).toFixed(1)}).join(" ");

 var k=Object.keys(S.hold),h="";

 else if(a==="tpa"){UPG.ta=Math.min(1e12,UPG.ta+1);UPG.res="";UPG.last=0}
 else if(a==="um"){upQuick("x",+b.dataset.v)}
 else if(a==="up"){upQuick("p",+b.dataset.v)}
 else if(a==="ug"){upGo();return}
 else if(S.admin&&a==="an"){addStock(val("sn"),val("st"),parseAmt(val("sp")),+val("sv"),val("sk"));return}
 else if(S.admin&&a==="dn"){delStock(t);return}
 else if(S.admin&&a==="dp"){var dq=parseAmt(val("dp"));if(dq>=.05&&SM[t]){pulseSet(t,dq);return}else MSG="Narxni toʻgʻri yozing ($0.05 dan)."}
 else if(S.admin&&a==="df"){var dfq=parseAmt(val("dp"));if(dfq>=.05&&SM[t]){MSG="Narx butun umrga oʻrnatildi ✅";fxSet(t,dfq);return}else MSG="Narxni toʻgʻri yozing ($0.05 dan)."}
 else if(S.admin&&a==="dr"){if(SM[t]){MSG="Narx asl holiga qaytarildi ✅";fxSet(t,0);return}}
 else if(S.admin&&a==="ar"){S.used=[]}
 else if(S.admin&&a==="ax"){S.admin=false}
 save();render()}

document.addEventListener("click",act);
document.addEventListener("pointerdown",function(){down=true});
document.addEventListener("pointerup",function(){down=false});
document.addEventListener("pointercancel",function(){down=false});
setInterval(function(){step();save();var ae=document.activeElement;if(!down&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()},4000);

if(window.claude&&claude.use)claude.use("db").then(function(d){
 if(!d)return;DB=d;
 DB.doc("config/stocks").onSnapshot(function(s){var x=s.exists?(s.data()||{}):{};CFG.stocks=Array.isArray(x.list)?x.list.map(function(a){return Object.assign({},a)}):[];applyStocks();var ae=document.activeElement;if(!down&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()},function(){});
 DB.doc("config/settings").onSnapshot(function(s){ST2=normCfg(s.exists?(s.data()||{}):S.cfg2);applyCfg2();var ae=document.activeElement;if(!down&&!AD&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()},function(){});
 DB.doc("config/promos").onSnapshot(function(s){var x=s.exists?(s.data()||{}):{};CFG.codes=x.codes&&typeof x.codes==="object"?Object.assign({},x.codes):{};var ae=document.activeElement;if(!down&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()},function(){});
}).catch(function(){});

if(window.claude&&claude.use)Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
 var d=r[0],U=r[1];if(!d||!U)return;
 return Promise.resolve(U.id()).then(function(id){
  DB=d;UID=id;
  DB.collection("players").onSnapshot(function(s){LP=s.docs.map(function(q){var x=Object.assign({},q.data()||{});x.id=q.id;return x});var ae=document.activeElement;if(!down&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()},function(){});
  DB.doc("cmds/"+UID).onSnapshot(function(s){
   if(!s.exists)return;var d2=s.data()||{};if(!d2.n||d2.n===S.cn)return;S.cn=d2.n;
   if(d2.luck)applyLuck(d2.luck);
   else if(d2.hide)S.hidden=true;
   else if(typeof d2.add==="number")S.cash=Math.max(0,S.cash+d2.add);
   else if(typeof d2.set==="number"){S.cash=Math.max(0,d2.set);S.hold={}}
   save();pushNow(true);render()},function(){});
  DB.collection("gifts").onSnapshot(function(s){
   S.got=S.got||[];S.inbox=S.inbox||[];var ch=false;
   s.docs.forEach(function(q){var d=q.data()||{};if(d.to!==UID||S.got.indexOf(q.id)>=0||!(+d.a>0))return;
    S.got.push(q.id);if(S.got.length>300)S.got.shift();
    if(d.type==="card") { S.card += +d.a; } else { S.cash += +d.a; }
    S.inbox.unshift({w:String(d.fn||"?").slice(0,16),a:+d.a});S.inbox=S.inbox.slice(0,10);ch=true;
    DB.doc("gifts/"+q.id).delete().catch(function(){})});
   if(ch){save();pushNow(true);var ae=document.activeElement;if(!down&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()}},function(){});
  DB.collection("admins").onSnapshot(function(s){
   AL=s.docs.map(function(q){var x=Object.assign({},q.data()||{});x.id=q.id;return x});
   var me=AL.filter(function(x){return x.id===UID})[0];if(me&&me.revoked&&S.admin){S.admin=false;MSG="Admin huquqingiz olib tashlandi.";save()}
   var ae=document.activeElement;if(!down&&!AD&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render()},function(){});
  regAdmin();
  pushNow(true);setInterval(pushNow,8000);render()})}).catch(function(){});
for(var pk in S.pp)unpump(pk);
render();
