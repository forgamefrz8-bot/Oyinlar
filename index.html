<style>

.msg{min-height:20px;font-size:14px;margin-top:6px}.ic{border-radius:50%;object-fit:cover;flex:none;display:block}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{background:var(--bar);border-radius:12px;padding:12px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:4px}.ctr{display:flex;align-items:center;gap:14px;margin-top:6px}.ctr button{width:34px;height:34px;border:0;border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:20px;font-weight:700}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cell{border:2px solid var(--bar);border-radius:10px;background:var(--card);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx);font:inherit;font-size:11px}.cell.on{border-color:var(--ac)}.cell:disabled{opacity:.4}.cell b{font-size:12px}.cnt{width:96px;margin:0;text-align:center;padding:7px}.bt .fi{margin:0;flex:2;min-width:0}@keyframes ld{from{width:0}to{width:100%}}@keyframes sp{0%{transform:rotate(0) scale(1)}50%{transform:rotate(360deg) scale(1.3)}100%{transform:rotate(720deg) scale(1)}}.ar{padding:10px 0;border-top:1px solid var(--bar);margin-top:8px}

  projectId:"akiya-77a1f",

};
(function(){
 var PFX="aksiya_";
 if(!window.firebase)return;
 try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){return}
 var fdb=firebase.firestore();
 function P(p){return PFX+p}
 function wrap(s){return {id:s.id,exists:s.exists,data:function(){return s.data()}}}
 window.claude={use:function(n){
  if(n==='user')return firebase.auth().signInAnonymously().then(function(c){return {id:function(){return c.user.uid},isOwner:function(){return false}}});

    onSnapshot:function(cb,eb){return r.onSnapshot(function(s){cb(wrap(s))},eb)}
   }},
   collection:function(p){var c=fdb.collection(P(p));return {

<script>
var ST=[
{t:"QSH",n:"Quyosh Energiya",p:2.4,v:.035,d:.002,c:"QUYOSH"},
{t:"TZK",n:"Tezkor Yetkazish",p:1.1,v:.06,d:.001,c:"TEZKOR"},
{t:"ONN",n:"Oltin Non",p:4.8,v:.02,d:.001,c:"NON"},
{t:"ZMT",n:"Zamon Texno",p:3.2,v:.05,d:.003,c:"ZAMON"},
{t:"BHR",n:"Bahor Dori",p:.75,v:.08,d:0,c:"BAHOR"},
{t:"YLQ",n:"Yoʻl Qurilish",p:5.5,v:.03,d:.0015,c:"YOL"},
{t:"BMW",n:"BMW",p:2500,v:.12,d:0,c:"M5"},
{t:"MEMC",n:"MemCoin",p:10000,v:.09,d:0,c:"ILON"}
];
var SM={};ST.forEach(function(s){SM[s.t]=s});var BASE_ST=ST.slice();
var MC={BONUS50:50,BOYLIK:500,KATTA:5000};
var ADMIN_H="816b1923f7e7c5ca33940151eac578f039cc3d3b99202b2779fb22fa60c71c05";
var DB=null,CFG={codes:{},stocks:[]};
var ST2={upK:.9,allOff:false,off:[],blocked:[],codes2:[],adOn:true,adVideo:"",adReward:1,adSecs:5,adCool:30,adText:"Homiy reklamasi: bu yerda sizning reklamangiz boʻlishi mumkin!",pulse:null,fx:{}};
var BMSG="";
var K="aksiya1",S=null,TAB="w",DET=null,MSG="",down=false,rsT=0;

function fresh(){var px={},h={};ST.forEach(function(s){px[s.t]=s.p;h[s.t]=[s.p]});return{cash:10,hold:{},px:px,h:h,real:0,t:Date.now(),seen:false,admin:false,used:[],pp:{},custom:{},cstocks:[],inbox:[],got:[]}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.px)S=fresh();
S.used=S.used||[];S.pp=S.pp||{};S.custom=S.custom||{};S.cstocks=S.cstocks||[];S.inbox=S.inbox||[];S.got=S.got||[];
// TUZATISH: used va custom ni cheklash (localStorage to'lib qolmasin)
if(S.used.length>200)S.used=S.used.slice(-200);
var _customKeys=Object.keys(S.custom);if(_customKeys.length>50){_customKeys.slice(0,-50).forEach(function(k){delete S.custom[k]})}

function okSt(s){return s&&typeof s.t==="string"&&/^[A-Z0-9]{2,5}$/.test(s.t)&&typeof s.n==="string"&&/^[\p{L}\p{N} .'ʻ’&-]{1,24}$/u.test(s.n)&&s.p>=.05&&s.v>0&&s.v<=.2&&typeof s.c==="string"&&/^[A-Z0-9]{3,16}$/.test(s.c)}
function customStocks(){var a=[],seen={};BASE_ST.forEach(function(b){seen[b.t]=1});(CFG.stocks||[]).concat(S.cstocks||[]).forEach(function(s){if(okSt(s)&&!seen[s.t]){seen[s.t]=1;a.push({t:s.t,n:s.n,p:+s.p,v:+s.v,d:0,c:s.c})}});return a}
function applyStocks(){
 ST.length=0;BASE_ST.forEach(function(b){ST.push(b)});customStocks().forEach(function(s){ST.push(s)});
 for(var k in SM)delete SM[k];
 ST.forEach(function(s){SM[s.t]=s;if(S.px[s.t]===undefined||!S.h[s.t]){S.px[s.t]=s.p;S.h[s.t]=[s.p]}});
 for(var t in S.hold)if(!SM[t]){S.cash+=S.hold[t].sh*(S.px[t]||0);delete S.hold[t]}
 for(var q in S.pp)if(!SM[q])delete S.pp[q];
 if(DET&&!SM[DET])DET=null}
function newGame(){var nk=S.nick,hd=S.hidden,cn=S.cn,gt=S.got;S=fresh();S.got=gt||[];S.cstocks=[];S.nick=nk;S.hidden=hd;S.cn=cn;applyStocks()}
function stockList(){var h="";customStocks().forEach(function(s){h+='<span>'+s.n+' ('+s.t+') <button class="rs" data-a="dn" data-t="'+s.t+'" style="margin:0 8px 0 2px">×</button></span> '});return h||"yoʻq"}
applyStocks();
function allCodes(){var o={},k;for(k in MC)o[k]=MC[k];for(k in CFG.codes)if(+CFG.codes[k]>0)o[k]=+CFG.codes[k];for(k in S.custom)o[k]=S.custom[k];return o}
function codeList(){var a=allCodes(),h="";for(var k in a){if(MC[k]!==undefined)continue;h+='<span>'+k+' — $'+a[k]+' <button class="rs" data-a="cd" data-t="'+k+'" style="margin:0 8px 0 2px">×</button></span> '}return h||"yoʻq"}
function save(){S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function rnd(){var u=0;for(var i=0;i<6;i++)u+=Math.random();return(u-3)/Math.sqrt(.5)}
function step(){ST.forEach(function(s){
 if(S.pp[s.t]!==undefined||S.px[s.t]===undefined||!S.h[s.t])return;
 var c=S.px[s.t],bs=(ST2.fx[s.t]&&+ST2.fx[s.t].p>0)?+ST2.fx[s.t].p:s.p,p=c*(1+s.d+s.v*rnd()+.01*(bs/c-1));
 if(p<.05)p=.05+Math.random()*.05;
 S.px[s.t]=p;var h=S.h[s.t];h.push(p);if(h.length>40)h.shift()})}
// TUZATISH: offline progressni 60 qadam bilan cheklash (4 daqiqa)
var n0=Math.min(60,Math.floor((Date.now()-S.t)/4000));for(var i=0;i<n0;i++)step();
function f(x){return x.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function sg(x){return(x>=0?"+":"−")+"$"+f(Math.abs(x))}
function worth(){var v=0;for(var t in S.hold)v+=S.hold[t].sh*S.px[t];return v}
function spark(a,up,big){
 var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a),hh=big?60:28,pts=a.map(function(v,i){return(i*100/(a.length-1||1)).toFixed(1)+","+(hh-(v-mn)/((mx-mn)||1)*hh).toFixed(1)}).join(" ");
 return'<svg viewBox="0 0 100 '+hh+'" '+(big?'width="100%" height="90" preserveAspectRatio="none"':'width="90" height="28"')+'><polyline vector-effect="non-scaling-stroke" fill="none" stroke="'+(up?"var(--ac)":"var(--rd)")+'" stroke-width="2" points="'+pts+'"/></svg>'}
function tempPrice(t,p,m){
 if(S.pp[t]!==undefined)return;
 S.pp[t]=S.px[t];S.px[t]=p;S.h[t].push(p);if(S.h[t].length>40)S.h[t].shift();
 MSG=m||"Narx $"+f(p)+" boʻldi. 3 soniyada oldingi holatiga qaytadi.";save();render();
 setTimeout(function(){unpump(t)},3000)}
// TUZATISH: pump() ikki marta chaqirilsa himoya
function pump(t){
 if(S.pp[t]!==undefined)return;
 S.pp[t]=S.px[t];S.px[t]=SM[t].p*5;S.h[t].push(S.px[t]);if(S.h[t].length>40)S.h[t].shift();
 MSG="🚀 Narx maksimumga chiqdi! 3 soniyada qaytadi. Tezroq soting!";save();render();
 setTimeout(function(){unpump(t)},3000)}
function unpump(t){
 if(S.pp[t]===undefined)return;
 S.px[t]=S.pp[t];delete S.pp[t];S.h[t].push(S.px[t]);if(S.h[t].length>40)S.h[t].shift();
 if(DET===t)MSG="Narx oldingi holatiga qaytdi.";save();render()}
function sha(s){
 if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error("no-crypto"));
 return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(h){return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function wallet(){
 var v=worth(),tot=S.cash+v,pl=tot-10,h="";
 if(!S.seen)h+='<div class="card gift"><b>🎁 Xush kelibsiz!</b><div>Sizga <b>$10</b> sovgʻa qilindi. Aksiya sotib oling, narxi oshishini kuting va soting.</div><button data-a="ok">Boshlash</button></div>';
 h+='<div class="card"><div class="mu">Naqd pul</div><div class="n">$'+f(S.cash)+'</div></div>';
 h+='<div class="card"><div class="row"><span class="mu">Aksiyalar qiymati</span><b>$'+f(v)+'</b></div><div class="row" style="margin-top:8px"><span class="mu">Jami boylik</span><b>$'+f(tot)+'</b></div><div class="row" style="margin-top:8px"><span class="mu">Umumiy foyda / zarar</span><b class="'+(pl>=0?"up":"dn")+'">'+sg(pl)+'</b></div><div class="row" style="margin-top:8px"><span class="mu">Sotishdan olingan foyda</span><b class="'+(S.real>=0?"up":"dn")+'">'+sg(S.real)+'</b></div></div>';
 return h+'<div style="text-align:center"><button class="rs" data-a="rs">'+(Date.now()-rsT<4000?"Aniqmi? Yana bosing":"Boshidan boshlash")+'</button></div>'}
function market(){
 return(BMSG?'<div class="card" style="font-weight:700">'+BMSG+'</div>':"")+ST.map(function(s){
  var h=S.h[s.t],p=S.px[s.t],ch=p/h[0]-1,up=ch>=0,H=S.hold[s.t],d=S.cash<.01?" disabled":"";
  return'<div class="card" data-open="'+s.t+'"><div class="row"><div style="display:flex;gap:10px;align-items:center">'+coin(s.t,46)+'<div><b>'+s.n+'</b><div class="mu">'+s.t+' • sizda: '+(H?H.sh.toFixed(3):"0")+' ta</div></div></div>'+spark(h,up)+'</div><div class="row" style="margin-top:6px"><span style="font-size:22px;font-weight:800">$'+f(p)+'</span><b class="'+(up?"up":"dn")+'">'+(up?"▲ +":"▼ ")+(ch*100).toFixed(1)+'%</b></div><div class="bt"><input class="fi" id="bi_'+s.t+'" type="text" autocomplete="off" placeholder="Pul ($): 100, 5k, 2M"><button data-a="bx" data-t="'+s.t+'"'+d+'>Sotib ol</button><button data-a="b" data-t="'+s.t+'" data-v="0"'+d+'>Hammasi</button></div></div>'}).join("")}
function port(){
 var k=Object.keys(S.hold),h="";
 h+=k.length?k.map(function(t){
  var H=S.hold[t],val=H.sh*S.px[t],pl=val-H.cost;
  return'<div class="card" data-open="'+t+'"><div class="row"><div style="display:flex;gap:10px;align-items:center">'+coin(t,40)+'<div><b>'+SM[t].n+'</b><div class="mu">'+t+' • '+H.sh.toFixed(3)+' ta</div></div></div><b>$'+f(val)+'</b></div><div class="row mu" style="margin-top:6px"><span>Sotib olingan: $'+f(H.cost)+'</span><b class="'+(pl>=0?"up":"dn")+'">'+sg(pl)+'</b></div><div class="bt"><button class="s" data-a="s" data-t="'+t+'" data-f=".5">Yarmini sot</button><button class="s" data-a="s" data-t="'+t+'" data-f="1">Hammasini sot</button></div></div>'}).join(""):'<div class="card mu" style="text-align:center">Hozircha aksiyangiz yoʻq. Bozor boʻlimidan sotib oling.</div>';
 h+=lbHtml();
 h+='<div class="card"><h4>🎟 Promokod</h4><div class="mu">Pul yoki admin huquqini beradi</div><input class="fi" id="pi" placeholder="Promokodni kiriting" autocomplete="off" autocapitalize="characters"><button class="pb" data-a="pc">Qoʻllash</button><div class="msg">'+MSG+'</div></div>';
 if(S.admin){
  h+='<div class="card"><h4>👑 Admin panel</h4>'+adminPlayers()+'<input class="fi" id="am" type="text" autocomplete="off" placeholder="Qancha pul qoʻshish (masalan: 100k, 2.5m)"><button class="pb" data-a="am">Pul qoʻshish</button><select class="fi" id="as">'+ST.map(function(s){return'<option value="'+s.t+'">'+s.n+'</option>'}).join("")+'</select><input class="fi" id="ap" type="text" autocomplete="off" placeholder="Yangi narx $ (masalan: 50 yoki 2k)"><button class="pb" data-a="ap">3 soniyaga (hamma uchun)</button><button class="pb" style="margin-top:6px" data-a="af">Butun umrga (hamma uchun)</button><button class="pb" style="margin-top:6px;background:var(--rd)" data-a="ar2">Asl narxga qaytarish</button>'+adminSettings()+adminLuck()+adminAccess()+'<h4 style="margin-top:12px">Yangi promokod</h4><input class="fi" id="cn" maxlength="16" placeholder="Kod nomi (masalan: DOST100)" autocapitalize="characters"><input class="fi" id="ca" type="text" autocomplete="off" placeholder="Necha dollar beradi (masalan: 500, 10k)"><button class="pb" data-a="cn">Promokod qoʻshish</button><div class="mu" style="margin-top:8px">Qoʻshilgan kodlar: '+codeList()+'</div><h4 style="margin-top:12px">Yangi aksiya</h4><input class="fi" id="sn" maxlength="24" placeholder="Kompaniya nomi"><input class="fi" id="st" maxlength="5" placeholder="Belgi (2–5 harf, masalan: ABC)" autocapitalize="characters"><input class="fi" id="sp" type="text" autocomplete="off" placeholder="Boshlangʻich narx $ (masalan: 2.5)"><select class="fi" id="sv"><option value="0.02">Sekin oʻzgaradi</option><option value="0.04" selected>Oʻrtacha</option><option value="0.08">Tez oʻzgaradi</option></select><input class="fi" id="sk" maxlength="16" placeholder="Aksiya promokodi (boʻsh = belgi)" autocapitalize="characters"><button class="pb" data-a="an">Aksiya qoʻshish</button><div class="mu" style="margin-top:8px">Qoʻshilgan aksiyalar: '+stockList()+'</div><div class="mu" style="margin-top:10px">Aksiya kodlari: '+ST.map(function(s){return s.t+" — "+s.c}).join(", ")+'</div><div class="bt"><button class="s" data-a="ar">Kodlarni tiklash</button><button class="s" data-a="ax">Admindan chiqish</button></div></div>'}
 return h}
function detail(t){
 var s=SM[t],h=S.h[t],p=S.px[t],ch=p/h[0]-1,up=ch>=0,H=S.hold[t],sh=H?H.sh:0,d=S.cash<.01?" disabled":"",ds=sh<1e-6?" disabled":"";
 var o='<button class="bk" data-a="bk">← Orqaga</button>';
 o+='<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center">'+coin(t,64)+'<div><b style="font-size:18px">'+s.n+'</b><div class="mu">'+t+'</div></div></div><b class="'+(up?"up":"dn")+'">'+(up?"▲ +":"▼ ")+(ch*100).toFixed(1)+'%</b></div><div class="n">$'+f(p)+'</div>'+spark(h,up,true)+'<div class="mu">Maksimum narx: $'+f(s.p*5)+'</div></div>';
 o+='<div class="card"><div class="mu">Sizda bor</div><div class="n" style="font-size:32px">'+sh.toFixed(3)+' ta aksiya</div>'+(H?'<div class="row mu"><span>Qiymati: $'+f(sh*p)+' • olingan: $'+f(H.cost)+'</span><b class="'+(sh*p-H.cost>=0?"up":"dn")+'">'+sg(sh*p-H.cost)+'</b></div>':'<div class="mu">Hali sotib olmagansiz</div>')+'</div>';
